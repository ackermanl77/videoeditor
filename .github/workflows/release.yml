name: Release

# Builds the app folder and its installer and publishes the installer plus a
# portable zip of the folder as GitHub Release assets -- unlike
# a workflow-run artifact, it doesn't expire after 90 days. Note: this only
# means "download without a GitHub login" on a PUBLIC repo. As long as this
# repository stays private, downloading a release asset still requires a
# GitHub account with access to the repo (confirmed live: an unauthenticated
# request for a release asset URL on this repo returns a plain 404, not the
# file) -- collaborators can still download it, just not an anonymous visitor.
#
# Triggered by pushing a version tag (git tag v0.1.0 && git push origin
# v0.1.0), or manually via workflow_dispatch for a one-off/test build from
# whatever branch is checked out -- that path tags the build "build-<sha>"
# and marks it a prerelease instead of a real numbered release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Never publish a build the test suite doesn't pass. Duplicates ci.yml's
  # own test job (rather than sharing it via a reusable workflow) since it's
  # only two steps -- ci.yml itself doesn't run on a tag push (it triggers on
  # branches, not tags), so this can't just depend on that run having already
  # happened.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - run: python -m unittest discover -s tests -v

  build-and-release:
    needs: test
    # PyInstaller does not cross-compile -- a Windows .exe has to be built on
    # a Windows runner (see docs/workflows/packaging/workflow.md).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Check the tag matches core.__version__
        if: github.ref_type == 'tag'
        run: python scripts/version_info.py --check-tag "${{ github.ref_name }}"

      # The tested versions (requirements-lock.txt, scripts/make_lock.py).
      - name: Install dependencies
        run: pip install -r requirements-build.txt -c requirements-lock.txt

      # Bundles the "essentials" FFmpeg build, not "full" -- see
      # docs/workflows/packaging/workflow.md for the size trade-off. The
      # version, download URL and SHA256 of the archive and of each binary
      # are pinned in ffmpeg.lock (it used to download gyan.dev's floating
      # "latest release" zip with no integrity check); the script fails the
      # build on any mismatch. build.spec bundles whatever ffmpeg*/ffprobe*
      # it finds in bin/.
      - name: Download and bundle the pinned FFmpeg (ffmpeg.lock)
        run: python scripts/fetch_ffmpeg.py

      # Inno Setup 6 compiles installer/VideoEditor.iss; install it only if the
      # runner image doesn't already have it.
      - name: Make sure Inno Setup 6 is available
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # A folder build (dist\VideoEditor\) plus its installer
      # (dist\installer\VideoEditor-<version>-setup.exe).
      - name: Build the app folder and the installer
        run: python build.py --installer

      - name: Verify the build was produced
        run: |
          if (-not (Test-Path "dist\VideoEditor\VideoEditor.exe")) {
            Write-Error "dist\VideoEditor\VideoEditor.exe was not produced by the build"
            exit 1
          }
          $setup = Get-ChildItem "dist\installer\VideoEditor-*-setup.exe" -ErrorAction SilentlyContinue
          if (-not $setup) {
            Write-Error "the installer was not produced by the build"
            exit 1
          }
          $setup | Select-Object Name, Length

      # The exe is windowed (no console), so check its exit code; the report
      # is written to %TEMP%\VideoEditor-selftest.txt (core/selftest.py).
      - name: Self-test the built exe (bundled FFmpeg, filters, a real export)
        run: |
          $p = Start-Process -FilePath "dist\VideoEditor\VideoEditor.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:TEMP\VideoEditor-selftest.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            Write-Error "VideoEditor.exe --self-test failed (exit code $($p.ExitCode))"
            exit 1
          }

      # The same folder as a zip, for people who'd rather not install.
      - name: Zip the portable folder
        run: |
          $version = python -c "import core; print(core.__version__)"
          Compress-Archive -Path "dist\VideoEditor" -DestinationPath "dist\VideoEditor-$version-portable.zip" -Force

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tagName = "${{ github.ref_name }}"
            $isPrerelease = $false
          } else {
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            $tagName = "build-$shortSha"
            $isPrerelease = $true
          }

          # pwsh doesn't expand globs for native commands: list the files explicitly.
          $assets = @(Get-ChildItem "dist\installer\VideoEditor-*-setup.exe", "dist\VideoEditor-*-portable.zip" | ForEach-Object { $_.FullName })
          gh release view $tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tagName @assets --clobber
          } else {
            $createArgs = @($tagName) + $assets + @("--title", "Open Video Editor $tagName", "--generate-notes")
            if ($isPrerelease) { $createArgs += "--prerelease" }
            gh release create @createArgs
          }
