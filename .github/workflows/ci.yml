name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA rather than a mutable tag (v4/v5), so a
      # compromised or re-pointed tag upstream can't silently change what
      # runs in this workflow — a security hardening practice, not a
      # functional need. Bump deliberately by looking up the new tag's own
      # commit SHA (`gh api repos/<owner>/<repo>/git/refs/tags/<tag>`), not
      # by trusting the tag name alone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # No `pip install` step: core/ (what tests/ exercises) has zero third-party
      # dependencies -- only PySide6 (UI), imageio-ffmpeg (fallback FFmpeg binary),
      # and pyinstaller (packaging) live in requirements.txt, and none of them are
      # importable from a test. Running the suite with nothing installed is a live
      # check of that architectural boundary: if a future change makes core/ (or a
      # test) depend on a third-party package, `unittest discover`'s own import step
      # fails immediately, the same way it would for any other missing dependency.
      - name: Compile check
        run: python -m compileall -q core ui main.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
