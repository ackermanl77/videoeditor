name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No `pip install` step: core/ (what tests/ exercises) has zero third-party
      # dependencies -- only PySide6 (UI), imageio-ffmpeg (fallback FFmpeg binary),
      # and pyinstaller (packaging) live in requirements.txt, and none of them are
      # importable from a test. Running the suite with nothing installed is a live
      # check of that architectural boundary: if a future change makes core/ (or a
      # test) depend on a third-party package, `unittest discover`'s own import step
      # fails immediately, the same way it would for any other missing dependency.
      - name: Compile check
        run: python -m compileall -q core ui main.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
